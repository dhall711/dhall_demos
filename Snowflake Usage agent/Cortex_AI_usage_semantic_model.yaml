  Data Characteristics:
  - Query-level tables (1-4): Per-query detail, immediate availability, full user/tag attribution
  - Token-level table (5): Hourly aggregates, 1-2 hour delay, no user attribution but actual token counts
  - Unified table (6): All services combined, immediate availability, includes model classification
  
