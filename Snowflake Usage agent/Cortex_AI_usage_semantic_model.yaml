name: CORTEX_AI_COST_ANALYST_SM
description: >
  Cortex AI Cost & Usage Model. Provides a unified business layer over all
  Snowflake Cortex AI services using dedicated ACCOUNT_USAGE views.
  Covers 10 source views: AISQL, Analyst, Intelligence, Agent, Search,
  Fine Tuning, Document AI, REST API, Code CLI, and Provisioned Throughput.
  Tracks credits, token consumption (input/output/total), users, services,
  and backcharge attribution. Designed for Cortex Analyst natural language queries.

tables:
  - name: CORTEX_AI_COST
    synonyms:
      - cortex ai usage
      - cortex costs
      - AI spending
      - AI credits
      - cortex billing
      - AI cost tracking
      - cortex token usage
      - cortex ai services
    description: >
      Unified Cortex AI cost and usage table aggregating data from 10 dedicated
      ACCOUNT_USAGE views. Each row represents a single cost event (inference call,
      search query, fine-tuning job, etc.) with credits consumed, token counts,
      user attribution, and optional backcharge fields. Use this table for ALL
      questions about Cortex AI costs, token usage, and service consumption.
    base_table:
      database: PLATFORM_ANALYTICS
      schema: PUBLIC
      table: CORTEX_AI_COST_VIEW
    dimensions:
      - name: SERVICE_TYPE
        synonyms:
          - service
          - ai service
          - cortex service
          - service category
          - product
        description: >
          The Cortex AI service that generated this cost event. Values include:
          CORTEX AISQL (LLM functions like COMPLETE, SUMMARIZE, TRANSLATE),
          CORTEX ANALYST (text-to-SQL inference),
          CORTEX AGENT (dedicated agent orchestration),
          CORTEX SEARCH (search service daily credits),
          DOCUMENT AI (document processing),
          CORTEX REST API (REST inference - tokens only, no credits),
          CORTEX CODE CLI (Cortex Code IDE),
          FINE TUNING (model fine-tuning jobs),
          PROVISIONED THROUGHPUT (reserved capacity PTUs).
        expr: SERVICE_TYPE
        data_type: VARCHAR
        sample_values:
          - CORTEX AISQL
          - CORTEX ANALYST
          - CORTEX AGENT
          - CORTEX SEARCH
          - DOCUMENT AI
          - CORTEX REST API

      - name: COST_COMPONENT
        synonyms:
          - cost type
          - component
          - charge type
          - billing component
        description: >
          Sub-classification of the cost within its service type.
          Examples: LLM Inference, Text-to-SQL Inference, Agent Inference,
          Snowflake Intelligence, Search Credits, Fine-Tuning Job, Document Processing,
          REST API Inference, Code CLI Inference, PTU Credits.
        expr: COST_COMPONENT
        data_type: VARCHAR
        sample_values:
          - LLM Inference
          - Text-to-SQL Inference
          - Agent Inference
          - Snowflake Intelligence

      - name: COMPONENT_DESCRIPTION
        synonyms:
          - description
          - details
          - cost details
        description: >
          Human-readable description of the cost event including model name,
          token counts, page counts, or PTU details depending on the service.
        expr: COMPONENT_DESCRIPTION
        data_type: VARCHAR

      - name: END_USER_NAME
        synonyms:
          - user
          - username
          - who
          - executed by
          - user name
        description: >
          The Snowflake user who triggered this AI operation. May be '(service - no user)'
          for background services like Search or Fine Tuning that have no direct user.
        expr: END_USER_NAME
        data_type: VARCHAR
        sample_values:
          - DHALL
          - SYSTEM
          - (service - no user)

      - name: END_USER_ROLE
        synonyms:
          - role
          - user role
          - security role
        description: The Snowflake role used for this operation (when available).
        expr: END_USER_ROLE
        data_type: VARCHAR

      - name: COMPONENT_OBJECT_NAME
        synonyms:
          - object name
          - function name
          - model name
          - agent name
          - service name
          - resource
        description: >
          The specific AI object or function involved. For AISQL this is the function
          name (COMPLETE, SUMMARIZE, etc.), for Agent/Intelligence this is the
          fully-qualified agent name, for Search this is the service name, for
          Fine Tuning this is the model being trained.
        expr: COMPONENT_OBJECT_NAME
        data_type: VARCHAR
        sample_values:
          - COMPLETE
          - Cortex Analyst
          - CORTEX AGENT (unnamed)
          - PLATFORM_ANALYTICS.PUBLIC.QUERY_HISTORY_SEARCH_SERVICE

      - name: WAREHOUSE_NAME
        synonyms:
          - warehouse
          - compute
          - virtual warehouse
        description: >
          The warehouse associated with this operation (when applicable).
          Many Cortex services are serverless and have no warehouse.
        expr: WAREHOUSE_NAME
        data_type: VARCHAR

      - name: QUERY_ID
        synonyms:
          - query id
          - request id
          - execution id
        description: Unique identifier for the query or request that generated this cost.
        expr: QUERY_ID
        data_type: VARCHAR

      - name: BACKCHARGE_TEAM
        synonyms:
          - team
          - chargeback team
          - cost center team
        description: Team responsible for this cost (populated via USER_CUSTOM_BACKCHARGES_MAPPING).
        expr: BACKCHARGE_TEAM
        data_type: VARCHAR

      - name: BACKCHARGE_BUSINESS_UNIT
        synonyms:
          - business unit
          - BU
          - division
        description: Business unit for cost allocation (populated via USER_CUSTOM_BACKCHARGES_MAPPING).
        expr: BACKCHARGE_BUSINESS_UNIT
        data_type: VARCHAR

      - name: BACKCHARGE_DEPARTMENT
        synonyms:
          - department
          - dept
          - cost center
        description: Department for cost allocation (populated via USER_CUSTOM_BACKCHARGES_MAPPING).
        expr: BACKCHARGE_DEPARTMENT
        data_type: VARCHAR

      - name: BACKCHARGE_OWNER
        synonyms:
          - owner
          - cost owner
          - budget owner
        description: Individual owner for cost attribution (populated via USER_CUSTOM_BACKCHARGES_MAPPING).
        expr: BACKCHARGE_OWNER
        data_type: VARCHAR

      - name: RECORD_KEY
        description: SHA-256 hash key uniquely identifying each cost record. Used for backcharge mapping joins.
        expr: RECORD_KEY
        data_type: VARCHAR

    time_dimensions:
      - name: START_TIME
        synonyms:
          - start time
          - when
          - date
          - timestamp
          - event time
        description: Timestamp when this AI operation started.
        expr: START_TIME
        data_type: TIMESTAMP_LTZ
        sample_values:
          - 2026-03-01T10:00:00.000+0000
          - 2026-02-15T14:30:00.000+0000
          - 2026-01-20T08:15:00.000+0000

      - name: END_TIME
        synonyms:
          - end time
          - completion time
          - finished at
        description: Timestamp when this AI operation completed.
        expr: END_TIME
        data_type: TIMESTAMP_LTZ

    facts:
      - name: COMPONENT_CREDITS
        synonyms:
          - credits
          - cost
          - credits used
          - credit consumption
          - spend
        description: >
          Snowflake credits consumed by this AI operation. NULL for CORTEX REST API
          (which tracks tokens but has no credits column). Use COALESCE(COMPONENT_CREDITS, 0)
          when summing across all services.
        expr: COMPONENT_CREDITS
        data_type: FLOAT
        sample_values:
          - '0.0234'
          - '0.1500'
          - '1.2345'

      - name: INPUT_TOKENS
        synonyms:
          - input tokens
          - prompt tokens
          - tokens in
          - request tokens
        description: >
          Number of input tokens for this operation. Includes prompt tokens plus
          cache_read_input and cache_write_input tokens. Available for AISQL,
          Agent, Intelligence, REST API, and Code CLI services. Zero for Search,
          Fine Tuning, Document AI, and Analyst (which lack token granularity).
        expr: INPUT_TOKENS
        data_type: NUMBER
        sample_values:
          - '1500'
          - '5000'
          - '0'

      - name: OUTPUT_TOKENS
        synonyms:
          - output tokens
          - completion tokens
          - tokens out
          - response tokens
          - generated tokens
        description: >
          Number of output (completion) tokens generated by this operation.
          Available for AISQL, Agent, Intelligence, REST API, and Code CLI.
        expr: OUTPUT_TOKENS
        data_type: NUMBER
        sample_values:
          - '200'
          - '1000'
          - '0'

      - name: TOTAL_TOKENS
        synonyms:
          - total tokens
          - all tokens
          - token count
          - tokens used
          - tokens consumed
        description: >
          Total tokens for this operation (from the source view's TOKENS column).
          For AISQL/REST/Code CLI this is input+output. For Search this is the
          daily token total. For Fine Tuning this is training tokens.
        expr: TOTAL_TOKENS
        data_type: NUMBER
        sample_values:
          - '1700'
          - '50000'
          - '0'

    filters:
      - name: RecentUsage
        synonyms:
          - recent
          - last 7 days
          - this week
        description: Cost events from the last 7 days.
        expr: START_TIME >= CURRENT_TIMESTAMP - INTERVAL '7 DAYS'

      - name: Last30Days
        synonyms:
          - last 30 days
          - this month
          - monthly
        description: Cost events from the last 30 days.
        expr: START_TIME >= CURRENT_TIMESTAMP - INTERVAL '30 DAYS'

      - name: HighCostEvents
        synonyms:
          - expensive
          - high cost
          - big spenders
        description: Events consuming more than 0.1 credits.
        expr: COALESCE(COMPONENT_CREDITS, 0) > 0.1

      - name: HasTokens
        synonyms:
          - token events
          - with tokens
        description: Events that consumed tokens.
        expr: TOTAL_TOKENS > 0

      - name: UserFacing
        synonyms:
          - user operations
          - human initiated
        description: Events triggered by actual users (excludes service-level background operations).
        expr: END_USER_NAME != '(service - no user)' AND END_USER_NAME != ''

      - name: LLMOperations
        synonyms:
          - llm
          - language model
          - completions
          - aisql
        description: Only CORTEX AISQL operations (LLM function calls like COMPLETE, SUMMARIZE, etc.).
        expr: SERVICE_TYPE = 'CORTEX AISQL'

      - name: AgentOperations
        synonyms:
          - agents
          - agent calls
          - cortex agent
        description: Only CORTEX AGENT operations.
        expr: SERVICE_TYPE = 'CORTEX AGENT'

      - name: AnalystOperations
        synonyms:
          - analyst
          - text-to-sql
          - intelligence
        description: Only CORTEX ANALYST operations (includes Snowflake Intelligence).
        expr: SERVICE_TYPE = 'CORTEX ANALYST'

      - name: SearchOperations
        synonyms:
          - search
          - cortex search
        description: Only CORTEX SEARCH operations.
        expr: SERVICE_TYPE = 'CORTEX SEARCH'

    metrics:
      - name: TotalCredits
        synonyms:
          - total credits
          - total cost
          - total spend
          - all credits
          - credit consumption
        description: Total Snowflake credits consumed. Uses COALESCE to handle NULL credits from REST API.
        expr: SUM(COALESCE(COMPONENT_CREDITS, 0))

      - name: TotalInputTokens
        synonyms:
          - total input tokens
          - total prompt tokens
          - input token consumption
        description: Total input tokens across all operations.
        expr: SUM(INPUT_TOKENS)

      - name: TotalOutputTokens
        synonyms:
          - total output tokens
          - total completion tokens
          - output token consumption
        description: Total output tokens across all operations.
        expr: SUM(OUTPUT_TOKENS)

      - name: TotalTokens
        synonyms:
          - total tokens
          - all tokens
          - token consumption
        description: Total tokens across all operations.
        expr: SUM(TOTAL_TOKENS)

      - name: RequestCount
        synonyms:
          - total requests
          - event count
          - operation count
          - number of calls
        description: Total number of AI operations/events.
        expr: COUNT(*)

      - name: UniqueUsers
        synonyms:
          - unique users
          - distinct users
          - user count
        description: Number of distinct users who triggered AI operations.
        expr: COUNT(DISTINCT END_USER_NAME)

      - name: AvgCreditsPerRequest
        synonyms:
          - average cost
          - avg credits
          - cost per request
          - unit cost
        description: Average credits consumed per AI operation.
        expr: AVG(COALESCE(COMPONENT_CREDITS, 0))

      - name: AvgTokensPerRequest
        synonyms:
          - average tokens
          - avg tokens
          - tokens per request
        description: Average total tokens per AI operation.
        expr: AVG(TOTAL_TOKENS)

      - name: TokenEfficiency
        synonyms:
          - tokens per credit
          - token efficiency
          - cost per token
        description: Token efficiency measured as total tokens per credit consumed.
        expr: SUM(TOTAL_TOKENS) / NULLIF(SUM(COALESCE(COMPONENT_CREDITS, 0)), 0)

      - name: DailyCredits
        synonyms:
          - daily cost
          - daily spend
          - credits per day
        description: Average daily credit consumption over the queried period.
        expr: SUM(COALESCE(COMPONENT_CREDITS, 0)) / NULLIF(DATEDIFF(DAY, MIN(START_TIME), MAX(START_TIME)) + 1, 0)

    primary_key:
      columns:
        - RECORD_KEY

verified_queries:
  - name: total_ai_spend_by_service
    question: What is my total Cortex AI spend by service?
    sql: |
      SELECT
        SERVICE_TYPE,
        COUNT(*) AS total_events,
        ROUND(SUM(COALESCE(COMPONENT_CREDITS, 0)), 4) AS total_credits,
        SUM(INPUT_TOKENS) AS total_input_tokens,
        SUM(OUTPUT_TOKENS) AS total_output_tokens,
        SUM(TOTAL_TOKENS) AS total_all_tokens,
        COUNT(DISTINCT END_USER_NAME) AS unique_users
      FROM PLATFORM_ANALYTICS.PUBLIC.CORTEX_AI_COST_VIEW
      GROUP BY SERVICE_TYPE
      ORDER BY total_credits DESC

  - name: daily_ai_cost_trend
    question: Show me daily Cortex AI cost trends for the last 30 days
    sql: |
      SELECT
        DATE_TRUNC('DAY', START_TIME) AS usage_date,
        SERVICE_TYPE,
        COUNT(*) AS daily_events,
        ROUND(SUM(COALESCE(COMPONENT_CREDITS, 0)), 4) AS daily_credits,
        SUM(TOTAL_TOKENS) AS daily_tokens
      FROM PLATFORM_ANALYTICS.PUBLIC.CORTEX_AI_COST_VIEW
      WHERE START_TIME >= DATEADD(DAY, -30, CURRENT_TIMESTAMP())
      GROUP BY DATE_TRUNC('DAY', START_TIME), SERVICE_TYPE
      ORDER BY usage_date DESC, daily_credits DESC

  - name: top_users_by_cost
    question: Which users are consuming the most Cortex AI credits?
    sql: |
      SELECT
        END_USER_NAME,
        COUNT(*) AS total_events,
        ROUND(SUM(COALESCE(COMPONENT_CREDITS, 0)), 4) AS total_credits,
        SUM(INPUT_TOKENS) AS total_input_tokens,
        SUM(OUTPUT_TOKENS) AS total_output_tokens,
        COUNT(DISTINCT SERVICE_TYPE) AS services_used,
        LISTAGG(DISTINCT SERVICE_TYPE, ', ') WITHIN GROUP (ORDER BY SERVICE_TYPE) AS service_list
      FROM PLATFORM_ANALYTICS.PUBLIC.CORTEX_AI_COST_VIEW
      WHERE END_USER_NAME != '(service - no user)'
      GROUP BY END_USER_NAME
      ORDER BY total_credits DESC
      LIMIT 20

  - name: agent_usage_details
    question: Show me Cortex Agent usage and costs
    sql: |
      SELECT
        COMPONENT_OBJECT_NAME AS agent_name,
        COUNT(*) AS total_requests,
        ROUND(SUM(COALESCE(COMPONENT_CREDITS, 0)), 4) AS total_credits,
        SUM(INPUT_TOKENS) AS total_input_tokens,
        SUM(OUTPUT_TOKENS) AS total_output_tokens,
        SUM(TOTAL_TOKENS) AS total_all_tokens,
        COUNT(DISTINCT END_USER_NAME) AS unique_users
      FROM PLATFORM_ANALYTICS.PUBLIC.CORTEX_AI_COST_VIEW
      WHERE SERVICE_TYPE = 'CORTEX AGENT'
      GROUP BY COMPONENT_OBJECT_NAME
      ORDER BY total_credits DESC

  - name: token_breakdown
    question: Show me token usage breakdown by service
    sql: |
      SELECT
        SERVICE_TYPE,
        SUM(INPUT_TOKENS) AS total_input_tokens,
        SUM(OUTPUT_TOKENS) AS total_output_tokens,
        SUM(TOTAL_TOKENS) AS total_all_tokens,
        ROUND(SUM(TOTAL_TOKENS) / NULLIF(SUM(COALESCE(COMPONENT_CREDITS, 0)), 0), 0) AS tokens_per_credit,
        ROUND(SUM(COALESCE(COMPONENT_CREDITS, 0)), 4) AS total_credits
      FROM PLATFORM_ANALYTICS.PUBLIC.CORTEX_AI_COST_VIEW
      WHERE TOTAL_TOKENS > 0
      GROUP BY SERVICE_TYPE
      ORDER BY total_all_tokens DESC

  - name: search_service_costs
    question: What are my Cortex Search Service costs?
    sql: |
      SELECT
        COMPONENT_OBJECT_NAME AS search_service,
        COST_COMPONENT,
        COUNT(*) AS total_events,
        ROUND(SUM(COALESCE(COMPONENT_CREDITS, 0)), 4) AS total_credits,
        SUM(TOTAL_TOKENS) AS total_tokens,
        MIN(START_TIME) AS earliest_event,
        MAX(START_TIME) AS latest_event
      FROM PLATFORM_ANALYTICS.PUBLIC.CORTEX_AI_COST_VIEW
      WHERE SERVICE_TYPE = 'CORTEX SEARCH'
      GROUP BY COMPONENT_OBJECT_NAME, COST_COMPONENT
      ORDER BY total_credits DESC

  - name: weekly_cost_comparison
    question: Compare this week's AI costs to last week
    sql: |
      SELECT
        CASE
          WHEN START_TIME >= CURRENT_TIMESTAMP - INTERVAL '7 DAYS' THEN 'This Week'
          ELSE 'Last Week'
        END AS period,
        SERVICE_TYPE,
        COUNT(*) AS total_events,
        ROUND(SUM(COALESCE(COMPONENT_CREDITS, 0)), 4) AS total_credits,
        SUM(TOTAL_TOKENS) AS total_tokens
      FROM PLATFORM_ANALYTICS.PUBLIC.CORTEX_AI_COST_VIEW
      WHERE START_TIME >= CURRENT_TIMESTAMP - INTERVAL '14 DAYS'
      GROUP BY
        CASE
          WHEN START_TIME >= CURRENT_TIMESTAMP - INTERVAL '7 DAYS' THEN 'This Week'
          ELSE 'Last Week'
        END,
        SERVICE_TYPE
      ORDER BY period, total_credits DESC

  - name: intelligence_usage
    question: Show me Snowflake Intelligence usage
    sql: |
      SELECT
        COMPONENT_OBJECT_NAME AS intelligence_name,
        COST_COMPONENT,
        END_USER_NAME,
        COUNT(*) AS total_requests,
        ROUND(SUM(COALESCE(COMPONENT_CREDITS, 0)), 4) AS total_credits,
        SUM(INPUT_TOKENS) AS total_input_tokens,
        SUM(OUTPUT_TOKENS) AS total_output_tokens
      FROM PLATFORM_ANALYTICS.PUBLIC.CORTEX_AI_COST_VIEW
      WHERE SERVICE_TYPE = 'CORTEX ANALYST'
        AND COST_COMPONENT IN ('Snowflake Intelligence', 'Agent API Inference')
      GROUP BY COMPONENT_OBJECT_NAME, COST_COMPONENT, END_USER_NAME
      ORDER BY total_credits DESC

  - name: llm_function_breakdown
    question: Which LLM functions are using the most tokens?
    sql: |
      SELECT
        COMPONENT_OBJECT_NAME AS function_or_model,
        COUNT(*) AS total_calls,
        ROUND(SUM(COALESCE(COMPONENT_CREDITS, 0)), 4) AS total_credits,
        SUM(INPUT_TOKENS) AS total_input_tokens,
        SUM(OUTPUT_TOKENS) AS total_output_tokens,
        SUM(TOTAL_TOKENS) AS total_all_tokens,
        ROUND(AVG(TOTAL_TOKENS), 0) AS avg_tokens_per_call
      FROM PLATFORM_ANALYTICS.PUBLIC.CORTEX_AI_COST_VIEW
      WHERE SERVICE_TYPE = 'CORTEX AISQL'
      GROUP BY COMPONENT_OBJECT_NAME
      ORDER BY total_all_tokens DESC

  - name: total_credits_last_30_days
    question: How many total credits have been used on Cortex AI in the last 30 days?
    sql: |
      SELECT
        ROUND(SUM(COALESCE(COMPONENT_CREDITS, 0)), 4) AS total_credits_last_30d,
        COUNT(*) AS total_events,
        SUM(TOTAL_TOKENS) AS total_tokens,
        COUNT(DISTINCT SERVICE_TYPE) AS services_active,
        COUNT(DISTINCT END_USER_NAME) AS unique_users
      FROM PLATFORM_ANALYTICS.PUBLIC.CORTEX_AI_COST_VIEW
      WHERE START_TIME >= DATEADD(DAY, -30, CURRENT_TIMESTAMP())

custom_instructions: |
  Setup Requirements:
  - Run create_cortex_views.sql to create the CORTEX_AI_USAGE.CORTEX_COST schema,
    summary table, stored procedure, and convenience view in PLATFORM_ANALYTICS.PUBLIC
  - The data is refreshed daily via REFRESH_COST_DATA_TASK (6 AM Pacific)
  - Manual refresh: CALL CORTEX_AI_USAGE.CORTEX_COST.REFRESH_CORTEX_COST_DATA();

  Data Architecture:
  - This model uses a SINGLE unified table (CORTEX_AI_COST) backed by
    CORTEX_AI_USAGE.CORTEX_COST.CORTEX_AI_SUMMARY_COST_VIEW
  - Data is sourced from 10 dedicated ACCOUNT_USAGE Cortex views (NOT QUERY_HISTORY text matching)
  - The stored procedure does a full TRUNCATE + INSERT from all 10 source views in a single UNION ALL

  Query Guidelines - CRITICAL:
  - There is only ONE table. All queries should use CORTEX_AI_COST directly.
  - Filter by SERVICE_TYPE for service-specific analysis
  - COMPONENT_CREDITS can be NULL (CORTEX REST API has no credits column) - ALWAYS use COALESCE(COMPONENT_CREDITS, 0) when summing
  - INPUT_TOKENS and OUTPUT_TOKENS are zero for services without token granularity (Search, Fine Tuning, Document AI, Analyst direct)
  - END_USER_NAME is '(service - no user)' for background services (Search, Fine Tuning, Provisioned Throughput)

  SERVICE_TYPE Values and What They Cover:
  - CORTEX AISQL: LLM functions (COMPLETE, SUMMARIZE, TRANSLATE, SENTIMENT, EMBED_TEXT, etc.) - has full token granularity
  - CORTEX ANALYST: Text-to-SQL inference from Cortex Analyst direct API calls - no token detail
  - CORTEX ANALYST (with COST_COMPONENT = 'Snowflake Intelligence' or 'Agent API Inference'): Intelligence/Agent orchestrated calls - has token detail
  - CORTEX AGENT: Dedicated Cortex Agent per-request inference - has token detail
  - CORTEX SEARCH: Cortex Search Service daily credits (indexing + serving) - tokens are daily totals, no input/output split
  - DOCUMENT AI: Document processing (extraction, classification) - has page/document counts in description
  - CORTEX REST API: REST API inference - has tokens but NO credits (COMPONENT_CREDITS is NULL)
  - CORTEX CODE CLI: Cortex Code IDE assistant - has token detail
  - FINE TUNING: Model fine-tuning jobs - tokens are training totals
  - PROVISIONED THROUGHPUT: Reserved capacity (PTU) credits

  When to Use Filters:
  - For LLM usage: SERVICE_TYPE = 'CORTEX AISQL'
  - For agent usage: SERVICE_TYPE = 'CORTEX AGENT'
  - For search costs: SERVICE_TYPE = 'CORTEX SEARCH'
  - For all AI costs: No filter needed, query the full table
  - For user-initiated only: END_USER_NAME != '(service - no user)'

  Cost Attribution:
  - Credits represent Snowflake credit consumption, NOT dollars
  - Do NOT convert credits to dollars (credit pricing varies by contract)
  - Use COALESCE(COMPONENT_CREDITS, 0) for all credit aggregations
  - Backcharge columns (BACKCHARGE_TEAM, BACKCHARGE_BUSINESS_UNIT, BACKCHARGE_DEPARTMENT, BACKCHARGE_OWNER) are NULL by default
  - Customers populate USER_CUSTOM_BACKCHARGES_MAPPING to enable cost allocation

  Data Freshness:
  - ACCOUNT_USAGE data has 45 minutes to 3 hours latency
  - Data is refreshed daily at 6 AM Pacific via scheduled task
  - For the latest data, run: CALL CORTEX_AI_USAGE.CORTEX_COST.REFRESH_CORTEX_COST_DATA()
