[global]
# Set to true for production deployments
developmentMode = false

[server]
# Port for the application
port = 8501

# Max upload size (for report uploads)
maxUploadSize = 50

# Enable CORS for cross-origin requests
enableCORS = true

# Enable WebSocket compression
enableWebsocketCompression = true

[browser]
# Automatically open browser when starting
gatherUsageStats = false

[theme]
# Application theme
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[logger]
# Logging level
level = "info"

[client]
# Show error details in production
showErrorDetails = true

# Toolbar mode
toolbarMode = "auto" 