# Streamlit in Snowflake Environment Configuration
# Specifies Python dependencies for the Multi-Project Monitor SiS app

name: snowflake_monitor_app
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - pip:
    # Core visualization and data processing
    - plotly>=5.15.0
    - pandas>=1.5.0
    
    # Date and time utilities
    - python-dateutil>=2.8.0
    
    # Note: streamlit and snowflake-connector-python are pre-installed in SiS environment 