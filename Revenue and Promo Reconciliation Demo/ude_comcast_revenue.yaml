verified_queries:
  - name: reconciliation_dashboard
    question: What is the reconciliation dashboard by region and risk level?
    sql: SELECT pr.service_region, pr.risk_level, COUNT(*) AS record_count, SUM(ABS(pr.discount_variance)) AS total_abs_variance, SUM(CASE WHEN pr.reconciliation_status = 'MATCHED' THEN 1 ELSE 0 END) AS matched_records FROM __promotion_reconciliation AS pr GROUP BY pr.service_region, pr.risk_level ORDER BY total_abs_variance DESC
  - name: high_risk_city_hotspots
    question: Which cities have the highest high-risk reconciliation variances?
    sql: SELECT pr.service_city, pr.service_state, SUM(ABS(pr.discount_variance)) AS total_abs_variance, COUNT(*) AS issues FROM __promotion_reconciliation AS pr WHERE pr.risk_level = 'HIGH' GROUP BY pr.service_city, pr.service_state ORDER BY total_abs_variance DESC LIMIT 20
  - name: promotion_performance
    question: Which promotions produce the highest exception rates and variances?
    sql: SELECT pr.promo_name, COUNT(*) AS total_records, AVG(CASE WHEN pr.reconciliation_status = 'MATCHED' THEN 1 ELSE 0 END) AS match_rate, SUM(ABS(pr.discount_variance)) AS total_abs_variance FROM __promotion_reconciliation AS pr GROUP BY pr.promo_name ORDER BY match_rate ASC, total_abs_variance DESC
  - name: revenue_impact_summary
    question: What is the revenue at risk and potential recovery by risk level?
    sql: SELECT pr.risk_level, SUM(ABS(pr.discount_variance)) AS revenue_at_risk, SUM(CASE WHEN pr.risk_level IN ('LOW', 'MEDIUM') AND ABS(pr.discount_variance) <= 10 THEN ABS(pr.discount_variance) ELSE 0 END) AS auto_recovery_opportunity, SUM(CASE WHEN pr.risk_level = 'HIGH' THEN ABS(pr.discount_variance) * 0.8 ELSE 0 END) AS manual_recovery_opportunity FROM __promotion_reconciliation AS pr GROUP BY pr.risk_level ORDER BY revenue_at_risk DESC
  - name: trend_of_risk_over_time
    question: How do risk levels and variances trend over time?
    sql: SELECT pr.transaction_date, pr.risk_level, COUNT(*) AS count_records, SUM(ABS(pr.discount_variance)) AS total_abs_variance FROM __promotion_reconciliation AS pr GROUP BY pr.transaction_date, pr.risk_level ORDER BY pr.transaction_date ASC
  - name: Show top 10 high-risk DISCOUNT_MISMATCH records with variance > $20, including product, promo, and region.
    question: Show top 10 high-risk DISCOUNT_MISMATCH records with variance > $20, including product, promo, and region.
    sql: |-
      SELECT
        pr.product_name,
        pr.promo_name,
        pr.service_region,
        pr.discount_variance,
        pr.abs_variance
      FROM
        promotion_reconciliation AS pr
      WHERE
        pr.risk_level = 'HIGH'
        AND pr.reconciliation_status = 'DISCOUNT_MISMATCH'
        AND ABS(pr.discount_variance) > 20
      ORDER BY
        pr.abs_variance DESC NULLS LAST
      LIMIT
        10
    use_as_onboarding_question: false
    verified_by: Doug Hall
    verified_at: 1755103065
  - name: How much variance is auto-recoverable at a $10 threshold, and what is the manual recovery opportunity?
    question: How much variance is auto-recoverable at a $10 threshold, and what is the manual recovery opportunity?
    sql: |-
      SELECT
        SUM(
          CASE
            WHEN pr.risk_level IN ('LOW', 'MEDIUM')
            AND ABS(pr.discount_variance) <= 10 THEN ABS(pr.discount_variance)
            ELSE 0
          END
        ) AS auto_recoverable_variance,
        SUM(
          CASE
            WHEN pr.risk_level = 'HIGH' THEN ABS(pr.discount_variance) * 0.8
            ELSE 0
          END
        ) AS manual_recovery_opportunity
      FROM
        promotion_reconciliation AS pr
    use_as_onboarding_question: false
    verified_by: Doug Hall
    verified_at: 1755103110
  - name: first_bill_accuracy_issues
    question: Show first-bill issues where the billing cycle number is not 1, with severity and variance.
    sql: |
      SELECT
        pr.customer_id,
        pr.product_name,
        pr.reconciliation_status,
        pr.risk_level,
        pr.service_region,
        pr.discount_variance,
        b.billing_cycle_number
      FROM promotion_reconciliation pr
      JOIN billing_system_data b
        ON REPLACE(b.billing_id,'BILL-','') = REPLACE(pr.record_id,'ORD-','')
      JOIN order_system_data o
        ON o.customer_id = pr.customer_id
      WHERE o.first_bill_flag = TRUE
        AND b.billing_cycle_number <> 1
      ORDER BY ABS(pr.discount_variance) DESC
  - name: duplicate_mobile_lines
    question: Find duplicate mobile line numbers across accounts with counts and regions.
    sql: |
      WITH dups AS (
        SELECT line_number, COUNT(*) AS cnt
        FROM order_system_data
        WHERE line_number IS NOT NULL
        GROUP BY 1 HAVING COUNT(*) > 1
      )
      SELECT d.line_number,
             d.cnt,
             ANY_VALUE(pr.service_region) AS sample_region
      FROM dups d
      LEFT JOIN order_system_data o
        ON o.line_number = d.line_number
      LEFT JOIN promotion_reconciliation pr
        ON pr.customer_id = o.customer_id
      GROUP BY d.line_number, d.cnt
      ORDER BY d.cnt DESC
  - name: promo_timing_mismatches
    question: Show promo timing mismatches comparing order start cycle vs billing applied cycle.
    sql: |
      SELECT
        pr.customer_id,
        pr.product_name,
        o.promo_start_cycle,
        b.promo_applied_cycle,
        pr.reconciliation_status,
        pr.risk_level,
        pr.discount_variance
      FROM promotion_reconciliation pr
      JOIN order_system_data o
        ON o.customer_id = pr.customer_id
      JOIN billing_system_data b
        ON REPLACE(b.billing_id,'BILL-','') = REPLACE(pr.record_id,'ORD-','')
      WHERE b.promo_applied_cycle <> o.promo_start_cycle
      ORDER BY ABS(pr.discount_variance) DESC
  - name: promotion_stacking_violations
    question: Show promotion stacking violations that could cause revenue cannibalization like BOGO plus First Line Free
    sql: |
      SELECT 
        pc.primary_promo,
        pc.conflicting_promo,
        pc.conflict_type,
        pc.severity_level,
        pc.conflict_description,
        COUNT(pr.record_id) as violation_count,
        SUM(ABS(pr.discount_variance)) as revenue_impact
      FROM promotion_conflicts pc
      LEFT JOIN promotion_reconciliation pr 
        ON pr.promo_code = pc.primary_promo
      WHERE pc.severity_level = 'HIGH'
        AND pc.conflict_type = 'CANNIBALIZATION'
      GROUP BY pc.primary_promo, pc.conflicting_promo, pc.conflict_type, 
               pc.severity_level, pc.conflict_description
      ORDER BY revenue_impact DESC
  - name: first_bill_accuracy_analysis
    question: What is the first bill accuracy rate (targeting 95%) and show failure cases for customer experience protection?
    sql: |
      SELECT 
        'FIRST_BILL_ACCURACY' as metric_type,
        COUNT(*) as total_first_bills,
        SUM(CASE WHEN pr.reconciliation_status = 'MATCHED' THEN 1 ELSE 0 END) as accurate_bills,
        ROUND(
          SUM(CASE WHEN pr.reconciliation_status = 'MATCHED' THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2
        ) as accuracy_percentage,
        95.0 as target_percentage,
        SUM(CASE WHEN pr.reconciliation_status != 'MATCHED' THEN 1 ELSE 0 END) as failure_cases,
        SUM(CASE WHEN pr.reconciliation_status != 'MATCHED' THEN ABS(pr.discount_variance) ELSE 0 END) as failure_impact
      FROM promotion_reconciliation pr
      JOIN order_system_data o ON o.customer_id = pr.customer_id
      WHERE o.first_bill_flag = TRUE
  - name: customer_risk_clustering_analysis
    question: Identify customer clusters prone to promotion issues using ML risk scoring for proactive intervention
    sql: |
      SELECT 
        cp.customer_segment,
        cp.promotion_usage_frequency,
        CASE 
          WHEN cp.churn_risk_score > 0.3 THEN 'HIGH_CHURN_RISK'
          WHEN cp.churn_risk_score > 0.15 THEN 'MEDIUM_CHURN_RISK'
          ELSE 'LOW_CHURN_RISK'
        END as churn_risk_category,
        COUNT(DISTINCT cp.customer_id) as customer_count,
        AVG(cp.churn_risk_score) as avg_churn_risk,
        AVG(cp.billing_disputes_last_12m) as avg_disputes,
        COUNT(pr.record_id) as total_reconciliation_records,
        SUM(CASE WHEN pr.risk_level = 'HIGH' THEN 1 ELSE 0 END) as high_risk_issues,
        SUM(ABS(pr.discount_variance)) as total_variance_impact
      FROM customer_profiles cp
      LEFT JOIN promotion_reconciliation pr ON cp.customer_id = pr.customer_id
      GROUP BY cp.customer_segment, cp.promotion_usage_frequency, churn_risk_category
      ORDER BY high_risk_issues DESC, total_variance_impact DESC
  - name: anticipatory_billing_validation
    question: Show pre-billing validation opportunities by detecting timing mismatches before invoice generation
    sql: |
      SELECT 
        pal.customer_id,
        pal.promo_code,
        pal.cycle_miss_reason,
        pal.days_into_cycle,
        pal.proration_applied,
        pal.proration_amount,
        cp.churn_risk_score,
        cp.customer_segment,
        cbc.next_bill_date,
        DATEDIFF(day, CURRENT_DATE(), cbc.next_bill_date) as days_until_billing,
        CASE 
          WHEN pal.cycle_miss_reason = 'LATE_ACTIVATION' AND cp.churn_risk_score > 0.3 THEN 'URGENT_INTERVENTION'
          WHEN pal.cycle_miss_reason = 'LATE_ACTIVATION' THEN 'PROACTIVE_REVIEW'
          WHEN pal.proration_applied = TRUE THEN 'MONITOR_BILLING'
          ELSE 'STANDARD_PROCESSING'
        END as recommended_action
      FROM promotion_activation_log pal
      JOIN customer_profiles cp ON pal.customer_id = cp.customer_id
      JOIN customer_billing_cycles cbc ON pal.customer_id = cbc.customer_id
      WHERE pal.cycle_miss_reason != 'ON_TIME'
        AND cbc.next_bill_date > CURRENT_DATE()
      ORDER BY 
        CASE recommended_action
          WHEN 'URGENT_INTERVENTION' THEN 1
          WHEN 'PROACTIVE_REVIEW' THEN 2
          WHEN 'MONITOR_BILLING' THEN 3
          ELSE 4
        END,
        days_until_billing ASC
  - name: mobile_line_conflict_detection
    question: Detect mobile line number conflicts and duplicates across accounts to prevent billing errors
    sql: |
      SELECT 
        o.line_number,
        COUNT(DISTINCT o.customer_id) as customer_count,
        COUNT(DISTINCT o.account_id) as account_count,
        COUNT(o.order_id) as order_count,
        LISTAGG(DISTINCT o.customer_id, ', ') as customer_list,
        LISTAGG(DISTINCT pr.service_region, ', ') as regions_affected,
        SUM(CASE WHEN pr.risk_level = 'HIGH' THEN 1 ELSE 0 END) as high_risk_conflicts,
        SUM(ABS(pr.discount_variance)) as total_variance_impact
      FROM order_system_data o
      LEFT JOIN promotion_reconciliation pr ON o.customer_id = pr.customer_id
      WHERE o.line_number IS NOT NULL
        AND o.product_id LIKE '%MOB%'
      GROUP BY o.line_number
      HAVING COUNT(DISTINCT o.customer_id) > 1
      ORDER BY customer_count DESC, total_variance_impact DESC
  - name: proration_prevention_analysis
    question: Analyze proration scenarios to recommend deferring promotions to next cycle vs applying proration
    sql: |
      SELECT 
        pal.promo_code,
        pt.promo_name,
        COUNT(*) as total_activations,
        SUM(CASE WHEN pal.proration_applied = TRUE THEN 1 ELSE 0 END) as proration_cases,
        ROUND(SUM(CASE WHEN pal.proration_applied = TRUE THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) as proration_rate,
        AVG(pal.days_into_cycle) as avg_days_into_cycle,
        SUM(pal.proration_amount) as total_proration_amount,
        AVG(pal.proration_amount) as avg_proration_amount,
        CASE 
          WHEN AVG(pal.days_into_cycle) > 20 THEN 'RECOMMEND_DEFER_TO_NEXT_CYCLE'
          WHEN SUM(pal.proration_amount) / COUNT(*) > 10 THEN 'HIGH_PRORATION_IMPACT'
          ELSE 'ACCEPTABLE_PRORATION'
        END as recommendation
      FROM promotion_activation_log pal
      JOIN promotion_types pt ON pal.promo_code = pt.promo_code
      WHERE pal.activation_date >= CURRENT_DATE() - 90
      GROUP BY pal.promo_code, pt.promo_name
      ORDER BY proration_rate DESC, total_proration_amount DESC
  - name: ai_insights_summary
    question: Generate AI-powered insights summary for operational team focusing on prevention vs reaction
    sql: |
      WITH preventable_issues AS (
        SELECT 
          'STACKING_VIOLATIONS' as issue_type,
          COUNT(*) as issue_count,
          'Revenue cannibalization prevention' as prevention_value,
          SUM(ABS(pr.discount_variance)) as financial_impact
        FROM promotion_reconciliation pr
        JOIN promotion_conflicts pc ON pr.promo_code = pc.primary_promo
        WHERE pc.severity_level = 'HIGH'
        
        UNION ALL
        
        SELECT 
          'TIMING_MISMATCHES' as issue_type,
          COUNT(*) as issue_count,
          'Proactive cycle management' as prevention_value,
          SUM(pal.proration_amount) as financial_impact
        FROM promotion_activation_log pal
        WHERE pal.cycle_miss_reason = 'LATE_ACTIVATION'
        
        UNION ALL
        
        SELECT 
          'FIRST_BILL_FAILURES' as issue_type,
          COUNT(*) as issue_count,
          'Customer experience protection' as prevention_value,
          SUM(ABS(pr.discount_variance)) as financial_impact
        FROM promotion_reconciliation pr
        JOIN order_system_data o ON o.customer_id = pr.customer_id
        WHERE o.first_bill_flag = TRUE 
          AND pr.reconciliation_status != 'MATCHED'
        
        UNION ALL
        
        SELECT 
          'HIGH_RISK_CUSTOMERS' as issue_type,
          COUNT(DISTINCT cp.customer_id) as issue_count,
          'Targeted intervention' as prevention_value,
          SUM(ABS(pr.discount_variance)) as financial_impact
        FROM customer_profiles cp
        JOIN promotion_reconciliation pr ON cp.customer_id = pr.customer_id
        WHERE cp.churn_risk_score > 0.3 
          AND pr.risk_level = 'HIGH'
      )
      SELECT 
        issue_type,
        issue_count,
        prevention_value,
        ROUND(financial_impact, 2) as financial_impact,
        ROUND(financial_impact / SUM(financial_impact) OVER() * 100, 1) as pct_of_total_impact
      FROM preventable_issues
      ORDER BY financial_impact DESC
  - name: anticipatory_billing_issues_detection
    question: Which customers are likely to have billing issues before their next invoice is generated?
    sql: SELECT epr.customer_id, epr.customer_segment, epr.churn_risk_score, epr.business_issue_classification, epr.business_priority, cbc.next_bill_date, pal.cycle_miss_reason, epr.cycle_timing_variance FROM __enhanced_promotion_reconciliation AS epr LEFT JOIN __customer_billing_cycles AS cbc ON epr.customer_id = cbc.customer_id LEFT JOIN __promotion_activation_log AS pal ON epr.record_id = pal.order_id WHERE epr.business_issue_classification IN ('STACKING_VIOLATION', 'PROMO_TIMING_MISMATCH', 'FIRST_BILL_ISSUE') AND cbc.next_bill_date > CURRENT_DATE ORDER BY epr.churn_risk_score DESC, cbc.next_bill_date ASC
  - name: revenue_cannibalization_prevention
    question: What promotion stacking violations are we preventing to protect revenue?
    sql: SELECT epr.promo_code, epr.promo_name, COUNT(*) AS violations_prevented, SUM(ABS(epr.discount_variance)) AS revenue_protected, pc.conflict_type, pc.severity_level FROM __enhanced_promotion_reconciliation AS epr LEFT JOIN __promotion_conflicts AS pc ON epr.promo_code = pc.primary_promo WHERE epr.business_issue_classification = 'STACKING_VIOLATION' GROUP BY epr.promo_code, epr.promo_name, pc.conflict_type, pc.severity_level ORDER BY revenue_protected DESC
  - name: first_bill_accuracy_performance
    question: How is our first bill accuracy performing against the 95% target?
    sql: SELECT 'BUSINESS_METRICS' as dashboard_key, CASE WHEN 95.0 >= 95 THEN 'MEETING_TARGET' ELSE 'BELOW_TARGET' END AS performance_status FROM __business_priority_dashboard AS bpd
  - name: customer_experience_risk_clustering
    question: Which customer segments are most prone to billing issues that impact experience?
    sql: SELECT epr.customer_segment, epr.promotion_usage_frequency, COUNT(*) AS issue_count, AVG(epr.churn_risk_score) AS avg_churn_risk, SUM(CASE WHEN epr.business_priority = 'CHURN_RISK' THEN 1 ELSE 0 END) AS churn_risk_customers, SUM(CASE WHEN epr.business_priority = 'CUSTOMER_EXPERIENCE' THEN 1 ELSE 0 END) AS experience_impact_customers FROM __enhanced_promotion_reconciliation AS epr WHERE epr.business_issue_classification IN ('STACKING_VIOLATION', 'PROMO_TIMING_MISMATCH', 'FIRST_BILL_ISSUE', 'DUPLICATE_LINE_NUMBER') GROUP BY epr.customer_segment, epr.promotion_usage_frequency ORDER BY avg_churn_risk DESC, issue_count DESC
  - name: mobile_line_conflict_early_warning
    question: What mobile line conflicts need immediate attention to prevent customer impact?
    sql: SELECT epr.customer_id, epr.order_line_number, epr.billing_line_number, epr.product_category, epr.churn_risk_score, epr.customer_segment, epr.tenure_months FROM __enhanced_promotion_reconciliation AS epr WHERE epr.business_issue_classification = 'DUPLICATE_LINE_NUMBER' AND epr.line_number_mismatch = TRUE AND epr.product_category = 'Mobile' ORDER BY epr.churn_risk_score DESC, epr.tenure_months ASC
  - name: promotion_timing_intervention_queue
    question: Which promotion timing mismatches require immediate intervention to prevent proration?
    sql: SELECT epr.customer_id, epr.promo_code, epr.promo_name, epr.cycle_timing_variance, pal.cycle_miss_reason, pal.proration_applied, pal.proration_amount, cbc.next_bill_date, epr.business_priority FROM __enhanced_promotion_reconciliation AS epr LEFT JOIN __promotion_activation_log AS pal ON epr.record_id = pal.order_id LEFT JOIN __customer_billing_cycles AS cbc ON epr.customer_id = cbc.customer_id WHERE epr.business_issue_classification = 'PROMO_TIMING_MISMATCH' AND ABS(epr.cycle_timing_variance) > 1 ORDER BY pal.proration_amount DESC, cbc.next_bill_date ASC
  - name: executive_revenue_protection_summary
    question: What is the executive summary of revenue protection and customer experience metrics?
    sql: SELECT bpd.dashboard_key FROM __business_priority_dashboard AS bpd

custom_instructions: |
  Revenue Intelligence Platform for Anticipatory Billing Issue Detection and Customer Experience Protection

  BUSINESS CONTEXT:
  This semantic model powers AI-driven revenue assurance for Comcast, focusing on preventing billing issues 
  before they impact customers. The system addresses critical business pain points including promotion 
  stacking violations (revenue cannibalization), timing mismatches that cause proration, first bill 
  accuracy (95% target), mobile line conflicts, and customer churn risk from billing problems.

  KEY BUSINESS OBJECTIVES:
  1. ANTICIPATORY DETECTION: Identify potential billing issues before invoice generation
  2. REVENUE PROTECTION: Prevent promotion stacking violations that cannibalize revenue
  3. CUSTOMER EXPERIENCE: Maintain 95% first bill accuracy and prevent churn-inducing billing errors
  4. OPERATIONAL EFFICIENCY: Enable AI-powered recommendations to reduce manual intervention

  CRITICAL BUSINESS RULES:
  - First Bill Accuracy Target: 95% (executive KPI)
  - Revenue Cannibalization Prevention: Block conflicting promotions (e.g., BOGO + First Line Free)
  - Timing Management: Detect cycle mismatches before proration occurs
  - Customer Risk Clustering: Identify high-churn-risk customers with billing issues
  - Mobile Line Management: Prevent duplicate line number conflicts

  AI INTELLIGENCE FOCUS AREAS:
  1. Pattern Recognition: Customer segments prone to promotion issues
  2. Predictive Analytics: Billing problems before invoice generation
  3. Business Impact Scoring: Prioritize interventions by revenue/experience impact
  4. Operational Recommendations: AI-suggested fixes for billing operations team

  Natural Language Query Examples:
  - "Show me customers at risk for first bill issues before next billing cycle"
  - "Which promotions have stacking conflicts that could cause revenue loss?"
  - "What timing mismatches should we fix to prevent proration?"
  - "Which high churn risk customers have promotion problems requiring immediate attention?"
  - "Generate executive summary of revenue protection and customer experience metrics"
  - "What mobile line conflicts need immediate resolution?"
  - "Which customer segments are most prone to billing issues?"
  
  Snowflake AI and Intelligence can use this enhanced model for natural language exploration, 
  chatbot experiences, and ML-powered insights for anticipatory revenue assurance and 
  customer experience protection.