name: comcast_revenue_intelligence
description: Business-Centric Revenue Intelligence Platform - AI-powered anticipatory billing issue detection, customer risk clustering, promotion stacking prevention, and revenue protection analytics optimized for executive decision-making and operational excellence
tables:
  - name: products
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: PRODUCTS
    dimensions:
      - name: product_id
        data_type: TEXT
        expr: PRODUCT_ID
        description: Unique product identifier
        unique: true
      - name: product_name
        data_type: TEXT
        expr: PRODUCT_NAME
        description: Comcast product name
      - name: product_category
        data_type: TEXT
        expr: PRODUCT_CATEGORY
        description: Product category (Internet, Television, Mobile, Security, Business, Streaming)
      - name: service_type
        data_type: TEXT
        expr: SERVICE_TYPE
        description: Residential, Business, or Mobile
    facts:
      - name: avg_base_price
        data_type: NUMBER
        expr: AVG(BASE_PRICE)
        description: Average base price for the product
    description: ''
    synonyms: []
    primary_key:
      columns:
        - PRODUCT_ID
  - name: promotion_types
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: PROMOTION_TYPES
    dimensions:
      - name: promo_code
        data_type: TEXT
        expr: PROMO_CODE
        description: Unique promotion code
        unique: true
      - name: promo_name
        data_type: TEXT
        expr: PROMO_NAME
        description: Human-readable promotion name
      - name: discount_type
        data_type: TEXT
        expr: DISCOUNT_TYPE
        description: PERCENTAGE, FIXED_AMOUNT, or FREE_MONTHS
      - name: duration_months
        data_type: NUMBER
        expr: DURATION_MONTHS
        description: Promotion duration in months
    facts:
      - name: avg_discount_value
        data_type: NUMBER
        expr: AVG(DISCOUNT_VALUE)
        description: Average configured discount value
    description: ''
    synonyms: []
    primary_key:
      columns:
        - PROMO_CODE
  - name: customers
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: CUSTOMERS
    dimensions:
      - name: customer_id
        data_type: TEXT
        expr: CUSTOMER_ID
        description: Unique customer identifier
        unique: true
      - name: service_city
        data_type: TEXT
        expr: SERVICE_CITY
        description: Customer city for service
      - name: service_state
        data_type: TEXT
        expr: SERVICE_STATE
        description: Customer state for service
      - name: service_region
        data_type: TEXT
        expr: SERVICE_REGION
        description: Region bucket (Northeast, Midwest, Southeast, South, West)
      - name: customer_lat
        data_type: NUMBER
        expr: CUSTOMER_LAT
        description: Customer latitude
      - name: customer_lon
        data_type: NUMBER
        expr: CUSTOMER_LON
        description: Customer longitude
    facts:
      - name: customer_count
        data_type: NUMBER
        expr: COUNT(DISTINCT CUSTOMER_ID)
        description: Number of customers
    description: ''
    synonyms: []
    primary_key:
      columns:
        - CUSTOMER_ID
  - name: service_areas
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: SERVICE_AREAS
    dimensions:
      - name: area_id
        data_type: TEXT
        expr: AREA_ID
        description: Unique service area identifier
        unique: true
      - name: city
        data_type: TEXT
        expr: CITY
        description: City name
      - name: state
        data_type: TEXT
        expr: STATE
        description: State code
      - name: region
        data_type: TEXT
        expr: REGION
        description: Region name
      - name: lat
        data_type: NUMBER
        expr: LAT
        description: Latitude
      - name: lon
        data_type: NUMBER
        expr: LON
        description: Longitude
    facts:
      - name: area_count
        data_type: NUMBER
        expr: COUNT(DISTINCT AREA_ID)
        description: Number of defined service areas
    description: ''
    synonyms: []
    primary_key:
      columns:
        - AREA_ID
  - name: order_system_data
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: ORDER_SYSTEM_DATA
    dimensions:
      - name: order_id
        data_type: TEXT
        expr: ORDER_ID
        description: Unique order identifier
        unique: true
      - name: customer_id
        data_type: TEXT
        expr: CUSTOMER_ID
        description: Customer placing the order
      - name: order_date
        data_type: DATE
        expr: ORDER_DATE
        description: Order date
      - name: product_id
        data_type: TEXT
        expr: PRODUCT_ID
        description: Product in the order
      - name: promo_code
        data_type: TEXT
        expr: PROMO_CODE
        description: Promotion applied at order time
      - name: order_status
        data_type: TEXT
        expr: ORDER_STATUS
        description: Order status
      - name: line_number
        data_type: TEXT
        expr: LINE_NUMBER
        description: Mobile line number on the order (may duplicate across accounts)
      - name: account_id
        data_type: TEXT
        expr: ACCOUNT_ID
        description: Billing account identifier
      - name: promo_start_cycle
        data_type: NUMBER
        expr: PROMO_START_CYCLE
        description: Expected cycle the promo should be applied starting on billing
      - name: promo_duration_months
        data_type: NUMBER
        expr: PROMO_DURATION_MONTHS
        description: Promotion duration in months from order system
      - name: first_bill_flag
        data_type: BOOLEAN
        expr: FIRST_BILL_FLAG
        description: Indicates first bill scenario (priority customer experience)
    facts:
      - name: orders_count
        data_type: NUMBER
        expr: COUNT(ORDER_ID)
        description: Number of orders
      - name: order_base_revenue
        data_type: NUMBER
        expr: SUM(BASE_AMOUNT)
        description: Sum of base amounts from orders
      - name: order_discount_total
        data_type: NUMBER
        expr: SUM(DISCOUNT_AMOUNT)
        description: Total order-side discounts
      - name: order_final_revenue
        data_type: NUMBER
        expr: SUM(FINAL_AMOUNT)
        description: Sum of final amounts from orders
    description: ''
    synonyms: []
    primary_key:
      columns:
        - ORDER_ID
  - name: billing_system_data
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: BILLING_SYSTEM_DATA
    dimensions:
      - name: billing_id
        data_type: TEXT
        expr: BILLING_ID
        description: Unique billing identifier
        unique: true
      - name: customer_id
        data_type: TEXT
        expr: CUSTOMER_ID
        description: Billed customer
      - name: billing_date
        data_type: DATE
        expr: BILLING_DATE
        description: Billing date
      - name: product_id
        data_type: TEXT
        expr: PRODUCT_ID
        description: Billed product
      - name: promo_code
        data_type: TEXT
        expr: PROMO_CODE
        description: Promotion used in billing
      - name: billing_cycle
        data_type: TEXT
        expr: BILLING_CYCLE
        description: Billing cycle identifier
      - name: billing_cycle_number
        data_type: NUMBER
        expr: BILLING_CYCLE_NUMBER
        description: Billing cycle ordinal number for the customer account
      - name: line_number
        data_type: TEXT
        expr: LINE_NUMBER
        description: Mobile line number on the billing record
      - name: account_id
        data_type: TEXT
        expr: ACCOUNT_ID
        description: Billing account identifier
      - name: promo_applied_cycle
        data_type: NUMBER
        expr: PROMO_APPLIED_CYCLE
        description: Cycle number when promo was actually applied in billing
      - name: promo_duration_months
        data_type: NUMBER
        expr: PROMO_DURATION_MONTHS
        description: Promotion duration in months from billing system
    facts:
      - name: billing_base_revenue
        data_type: NUMBER
        expr: SUM(BASE_AMOUNT)
        description: Sum of base amounts from billing
      - name: billing_discount_total
        data_type: NUMBER
        expr: SUM(DISCOUNT_AMOUNT)
        description: Total billing-side discounts
      - name: billing_final_revenue
        data_type: NUMBER
        expr: SUM(FINAL_AMOUNT)
        description: Sum of final amounts from billing
    description: ''
    synonyms: []
    primary_key:
      columns:
        - BILLING_ID
  - name: promotion_reconciliation
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: PROMOTION_RECONCILIATION
    dimensions:
      - name: record_id
        data_type: TEXT
        expr: RECORD_ID
        description: Unique reconciliation record id
        unique: true
      - name: customer_id
        data_type: TEXT
        expr: CUSTOMER_ID
        description: Customer identifier
      - name: transaction_date
        data_type: DATE
        expr: TRANSACTION_DATE
        description: Transaction date
      - name: product_id
        data_type: TEXT
        expr: PRODUCT_ID
        description: Product identifier
      - name: product_name
        data_type: TEXT
        expr: PRODUCT_NAME
        description: Product name
      - name: product_category
        data_type: TEXT
        expr: PRODUCT_CATEGORY
        description: Product category
      - name: promo_code
        data_type: TEXT
        expr: PROMO_CODE
        description: Promotion code
      - name: promo_name
        data_type: TEXT
        expr: PROMO_NAME
        description: Promotion name
      - name: reconciliation_status
        data_type: TEXT
        expr: RECONCILIATION_STATUS
        description: MATCHED, DISCOUNT_MISMATCH, AMOUNT_MISMATCH, ORDER_ONLY, BILLING_ONLY
      - name: risk_level
        data_type: TEXT
        expr: RISK_LEVEL
        description: HIGH, MEDIUM, LOW risk classification
      - name: service_city
        data_type: TEXT
        expr: SERVICE_CITY
        description: City of service
      - name: service_state
        data_type: TEXT
        expr: SERVICE_STATE
        description: State of service
      - name: service_region
        data_type: TEXT
        expr: SERVICE_REGION
        description: Region of service
      - name: customer_lat
        data_type: NUMBER
        expr: CUSTOMER_LAT
        description: Customer latitude
      - name: customer_lon
        data_type: NUMBER
        expr: CUSTOMER_LON
        description: Customer longitude
      - name: discount_variance
        data_type: NUMBER
        expr: DISCOUNT_VARIANCE
        description: Discount variance (order - billing)
      - name: final_amount_variance
        data_type: NUMBER
        expr: FINAL_AMOUNT_VARIANCE
        description: Final amount variance (order - billing)
      - name: abs_variance
        data_type: NUMBER
        expr: ABS_VARIANCE
        description: Absolute discount variance used for severity ranking
    time_dimensions:
      - name: transaction_date
        data_type: DATE
        expr: TRANSACTION_DATE
        description: Transaction date for temporal analysis
    facts:
      - name: order_base_amount
        data_type: NUMBER
        expr: SUM(ORDER_BASE_AMOUNT)
        description: Total order-side base amount
      - name: order_discount_amount
        data_type: NUMBER
        expr: SUM(ORDER_DISCOUNT_AMOUNT)
        description: Total order-side discount amount
      - name: order_final_amount
        data_type: NUMBER
        expr: SUM(ORDER_FINAL_AMOUNT)
        description: Total order-side final amount
      - name: billing_base_amount
        data_type: NUMBER
        expr: SUM(BILLING_BASE_AMOUNT)
        description: Total billing-side base amount
      - name: billing_discount_amount
        data_type: NUMBER
        expr: SUM(BILLING_DISCOUNT_AMOUNT)
        description: Total billing-side discount amount
      - name: billing_final_amount
        data_type: NUMBER
        expr: SUM(BILLING_FINAL_AMOUNT)
        description: Total billing-side final amount
      - name: discount_variance
        data_type: NUMBER
        expr: SUM(DISCOUNT_VARIANCE)
        description: Total discount variance (order - billing)
      - name: final_amount_variance
        data_type: NUMBER
        expr: SUM(FINAL_AMOUNT_VARIANCE)
        description: Total final amount variance (order - billing)
      - name: abs_variance
        data_type: NUMBER
        expr: SUM(ABS_VARIANCE)
        description: Sum of absolute discount variance
      - name: high_risk_revenue_at_risk
        data_type: NUMBER
        expr: SUM(CASE WHEN RISK_LEVEL = 'HIGH' THEN ABS(DISCOUNT_VARIANCE) ELSE 0 END)
        description: Revenue at risk from high-risk reconciliation cases
      - name: auto_recoverable_variance_10
        data_type: NUMBER
        expr: SUM(CASE WHEN RISK_LEVEL IN ('LOW','MEDIUM') AND ABS(DISCOUNT_VARIANCE) <= 10 THEN ABS(DISCOUNT_VARIANCE) ELSE 0 END)
        description: Variance eligible for automated recovery using $10 threshold
    description: ''
    synonyms: []
    primary_key:
      columns:
        - RECORD_ID
  - name: reconciliation_summary
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: RECONCILIATION_SUMMARY
    dimensions:
      - name: dummy_key
        data_type: TEXT
        expr: DUMMY_KEY
        description: Singleton dimension for summary aggregation
        unique: true
    facts:
      - name: total_records
        data_type: NUMBER
        expr: SUM(TOTAL_RECORDS)
        description: Total reconciliation records
      - name: matched_records
        data_type: NUMBER
        expr: SUM(MATCHED_RECORDS)
        description: Counts of matched records
      - name: exception_records
        data_type: NUMBER
        expr: SUM(EXCEPTION_RECORDS)
        description: Counts of exception records
      - name: match_rate_pct
        data_type: NUMBER
        expr: AVG(MATCH_RATE_PCT)
        description: Average match rate percent
      - name: total_discount_variance
        data_type: NUMBER
        expr: SUM(TOTAL_DISCOUNT_VARIANCE)
        description: Sum of absolute discount variance
      - name: total_amount_variance
        data_type: NUMBER
        expr: SUM(TOTAL_AMOUNT_VARIANCE)
        description: Sum of absolute final amount variance
      - name: high_risk_count
        data_type: NUMBER
        expr: SUM(HIGH_RISK_COUNT)
        description: Count of high risk items
      - name: medium_risk_count
        data_type: NUMBER
        expr: SUM(MEDIUM_RISK_COUNT)
        description: Count of medium risk items
      - name: low_risk_count
        data_type: NUMBER
        expr: SUM(LOW_RISK_COUNT)
        description: Count of low risk items
    description: ''
    synonyms: []
    primary_key:
      columns:
        - DUMMY_KEY
  - name: promotion_conflicts
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: PROMOTION_CONFLICTS
    dimensions:
      - name: conflict_id
        data_type: TEXT
        expr: CONFLICT_ID
        description: Unique conflict identifier
        unique: true
      - name: primary_promo
        data_type: TEXT
        expr: PRIMARY_PROMO
        description: Primary promotion code
      - name: conflicting_promo
        data_type: TEXT
        expr: CONFLICTING_PROMO
        description: Conflicting promotion code
      - name: conflict_type
        data_type: TEXT
        expr: CONFLICT_TYPE
        description: CANNIBALIZATION, STACKING_VIOLATION, BUSINESS_RULE, DEMOGRAPHIC_CONFLICT
      - name: severity_level
        data_type: TEXT
        expr: SEVERITY_LEVEL
        description: HIGH, MEDIUM, LOW severity classification
      - name: conflict_description
        data_type: TEXT
        expr: CONFLICT_DESCRIPTION
        description: Human-readable description of the conflict
      - name: financial_impact_description
        data_type: TEXT
        expr: FINANCIAL_IMPACT_DESCRIPTION
        description: Business impact explanation
    facts:
      - name: conflict_count
        data_type: NUMBER
        expr: COUNT(CONFLICT_ID)
        description: Number of promotion conflicts defined
      - name: high_severity_conflicts
        data_type: NUMBER
        expr: SUM(CASE WHEN SEVERITY_LEVEL = 'HIGH' THEN 1 ELSE 0 END)
        description: Count of high-severity promotion conflicts
    description: 'Promotion stacking violations prevention (BOGO + First Line Free = revenue cannibalization)'
    synonyms: [promotion rules, stacking violations, promo conflicts]
    primary_key:
      columns:
        - CONFLICT_ID
  - name: customer_profiles
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: CUSTOMER_PROFILES
    dimensions:
      - name: customer_id
        data_type: TEXT
        expr: CUSTOMER_ID
        description: Unique customer identifier
        unique: true
      - name: account_id
        data_type: TEXT
        expr: ACCOUNT_ID
        description: Billing account identifier
      - name: customer_segment
        data_type: TEXT
        expr: CUSTOMER_SEGMENT
        description: RESIDENTIAL, BUSINESS, STUDENT, SENIOR customer segments
      - name: tenure_months
        data_type: NUMBER
        expr: TENURE_MONTHS
        description: Customer tenure in months
      - name: promotion_usage_frequency
        data_type: TEXT
        expr: PROMOTION_USAGE_FREQUENCY
        description: LOW, MEDIUM, HIGH promotion usage patterns
      - name: churn_risk_score
        data_type: NUMBER
        expr: CHURN_RISK_SCORE
        description: ML-derived churn risk score (0.00-1.00)
      - name: payment_history_score
        data_type: NUMBER
        expr: PAYMENT_HISTORY_SCORE
        description: Payment reliability score (1-100)
      - name: billing_disputes_last_12m
        data_type: NUMBER
        expr: BILLING_DISPUTES_LAST_12M
        description: Number of billing disputes in last 12 months
      - name: service_region
        data_type: TEXT
        expr: SERVICE_REGION
        description: Primary service region
    facts:
      - name: lifetime_value
        data_type: NUMBER
        expr: SUM(LIFETIME_VALUE)
        description: Total customer lifetime value
      - name: avg_churn_risk_score
        data_type: NUMBER
        expr: AVG(CHURN_RISK_SCORE)
        description: Average churn risk score
      - name: high_risk_customers
        data_type: NUMBER
        expr: SUM(CASE WHEN CHURN_RISK_SCORE > 0.3 THEN 1 ELSE 0 END)
        description: Count of high churn risk customers
      - name: frequent_promo_users
        data_type: NUMBER
        expr: SUM(CASE WHEN PROMOTION_USAGE_FREQUENCY = 'HIGH' THEN 1 ELSE 0 END)
        description: Count of frequent promotion users
      - name: dispute_prone_customers
        data_type: NUMBER
        expr: SUM(CASE WHEN BILLING_DISPUTES_LAST_12M >= 3 THEN 1 ELSE 0 END)
        description: Customers with 3+ disputes in last 12 months
    description: 'Customer clustering for promotion issue patterns and ML-powered risk segmentation'
    synonyms: [customer risk, customer behavior, customer segmentation, churn risk]
    primary_key:
      columns:
        - CUSTOMER_ID
  - name: customer_billing_cycles
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: CUSTOMER_BILLING_CYCLES
    dimensions:
      - name: customer_id
        data_type: TEXT
        expr: CUSTOMER_ID
        description: Customer identifier
      - name: account_id
        data_type: TEXT
        expr: ACCOUNT_ID
        description: Billing account identifier
      - name: billing_cycle_day
        data_type: NUMBER
        expr: BILLING_CYCLE_DAY
        description: Day of month for billing cycle (1-31)
      - name: cycle_start_date
        data_type: DATE
        expr: CYCLE_START_DATE
        description: Billing cycle start date
      - name: cycle_end_date
        data_type: DATE
        expr: CYCLE_END_DATE
        description: Billing cycle end date
      - name: next_bill_date
        data_type: DATE
        expr: NEXT_BILL_DATE
        description: Next scheduled billing date
      - name: proration_policy
        data_type: TEXT
        expr: PRORATION_POLICY
        description: FULL_MONTH, DAILY_PRORATION, WEEKLY_PRORATION
      - name: timezone
        data_type: TEXT
        expr: TIMEZONE
        description: Customer timezone for billing
    facts:
      - name: customer_cycles_count
        data_type: NUMBER
        expr: COUNT(DISTINCT CUSTOMER_ID)
        description: Number of customers with billing cycles
      - name: avg_cycle_day
        data_type: NUMBER
        expr: AVG(BILLING_CYCLE_DAY)
        description: Average billing cycle day
    description: 'Billing cycle timing management for promotion activation alignment'
    synonyms: [billing cycles, cycle timing, billing schedule]
    primary_key:
      columns:
        - CUSTOMER_ID
        - CYCLE_START_DATE
  - name: enhanced_promotion_reconciliation
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: ENHANCED_PROMOTION_RECONCILIATION
    dimensions:
      - name: record_id
        data_type: TEXT
        expr: RECORD_ID
        description: Unique reconciliation record
        unique: true
      - name: customer_id
        data_type: TEXT
        expr: CUSTOMER_ID
        description: Customer identifier
      - name: customer_segment
        data_type: TEXT
        expr: CUSTOMER_SEGMENT
        description: RESIDENTIAL, BUSINESS, STUDENT, SENIOR
      - name: business_issue_classification
        data_type: TEXT
        expr: BUSINESS_ISSUE_CLASSIFICATION
        description: STACKING_VIOLATION, PROMO_TIMING_MISMATCH, DUPLICATE_LINE_NUMBER, FIRST_BILL_ISSUE
      - name: business_priority
        data_type: TEXT
        expr: BUSINESS_PRIORITY
        description: CHURN_RISK, CUSTOMER_EXPERIENCE, MOBILE_PRIORITY, STANDARD
      - name: cycle_timing_variance
        data_type: NUMBER
        expr: CYCLE_TIMING_VARIANCE
        description: Difference in promotion timing cycles
      - name: line_number_mismatch
        data_type: BOOLEAN
        expr: LINE_NUMBER_MISMATCH
        description: True if order and billing line numbers differ
      - name: churn_risk_score
        data_type: NUMBER
        expr: CHURN_RISK_SCORE
        description: Customer churn likelihood (0.00-1.00)
      - name: promotion_usage_frequency
        data_type: TEXT
        expr: PROMOTION_USAGE_FREQUENCY
        description: LOW, MEDIUM, HIGH frequency of promotion usage
      - name: tenure_months
        data_type: NUMBER
        expr: TENURE_MONTHS
        description: Customer tenure in months
      - name: promo_code
        data_type: TEXT
        expr: PROMO_CODE
        description: Promotion code
      - name: promo_name
        data_type: TEXT
        expr: PROMO_NAME
        description: Promotion name
      - name: discount_variance
        data_type: NUMBER
        expr: DISCOUNT_VARIANCE
        description: Discount variance amount
      - name: order_line_number
        data_type: TEXT
        expr: ORDER_LINE_NUMBER
        description: Order system line number
      - name: billing_line_number
        data_type: TEXT
        expr: BILLING_LINE_NUMBER
        description: Billing system line number
      - name: product_category
        data_type: TEXT
        expr: PRODUCT_CATEGORY
        description: Product category
    facts:
      - name: high_priority_issues
        data_type: NUMBER
        expr: SUM(CASE WHEN BUSINESS_PRIORITY IN ('CHURN_RISK', 'CUSTOMER_EXPERIENCE') THEN 1 ELSE 0 END)
        description: Count of high-priority business issues
      - name: stacking_violations_prevented
        data_type: NUMBER
        expr: SUM(CASE WHEN BUSINESS_ISSUE_CLASSIFICATION = 'STACKING_VIOLATION' THEN 1 ELSE 0 END)
        description: Revenue protection - stacking violations caught
      - name: timing_mismatches_detected
        data_type: NUMBER
        expr: SUM(CASE WHEN BUSINESS_ISSUE_CLASSIFICATION = 'PROMO_TIMING_MISMATCH' THEN 1 ELSE 0 END)
        description: Timing issues requiring intervention
      - name: mobile_line_conflicts
        data_type: NUMBER
        expr: SUM(CASE WHEN BUSINESS_ISSUE_CLASSIFICATION = 'DUPLICATE_LINE_NUMBER' THEN 1 ELSE 0 END)
        description: Mobile line management issues
      - name: churn_risk_customers
        data_type: NUMBER
        expr: SUM(CASE WHEN BUSINESS_PRIORITY = 'CHURN_RISK' THEN 1 ELSE 0 END)
        description: Customers at risk of churning due to billing issues
      - name: avg_churn_risk_score
        data_type: NUMBER
        expr: AVG(CHURN_RISK_SCORE)
        description: Average customer churn risk across reconciliation issues
      - name: revenue_protection_value
        data_type: NUMBER
        expr: SUM(CASE WHEN BUSINESS_ISSUE_CLASSIFICATION = 'STACKING_VIOLATION' THEN ABS(DISCOUNT_VARIANCE) ELSE 0 END)
        description: Revenue protected through stacking violation prevention
    description: 'Comprehensive business intelligence view combining reconciliation data with customer context, timing analysis, and business impact scoring for anticipatory revenue assurance'
    synonyms: [business reconciliation, enhanced revenue intelligence, customer context reconciliation]
    primary_key:
      columns:
        - RECORD_ID
  - name: business_priority_dashboard
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: BUSINESS_PRIORITY_DASHBOARD
    dimensions:
      - name: dashboard_key
        data_type: TEXT
        expr: "'BUSINESS_METRICS'"
        description: Static key for dashboard aggregations
    facts:
      - name: total_transactions
        data_type: NUMBER
        expr: TOTAL_TRANSACTIONS
        description: Total revenue transactions processed
      - name: first_bill_accuracy_pct
        data_type: NUMBER
        expr: FIRST_BILL_ACCURACY_PCT
        description: First bill accuracy percentage (target 95%)
      - name: mobile_line_duplicates
        data_type: NUMBER
        expr: MOBILE_LINE_DUPLICATES
        description: Mobile line duplicate conflicts detected
      - name: promo_timing_issues
        data_type: NUMBER
        expr: PROMO_TIMING_ISSUES
        description: Promotion timing mismatches requiring intervention
      - name: stacking_violations
        data_type: NUMBER
        expr: STACKING_VIOLATIONS
        description: Revenue cannibalization violations prevented
      - name: high_risk_variance
        data_type: NUMBER
        expr: HIGH_RISK_VARIANCE
        description: Financial impact of high-risk reconciliation issues
      - name: churn_risk_customers
        data_type: NUMBER
        expr: CHURN_RISK_CUSTOMERS
        description: Customers at high churn risk due to billing problems
      - name: preventable_issues
        data_type: NUMBER
        expr: PREVENTABLE_ISSUES
        description: Issues that could be prevented with AI intervention
    description: 'Executive dashboard metrics for revenue assurance performance and business impact measurement'
    synonyms: [executive metrics, business kpis, revenue dashboard]
    primary_key:
      columns:
        - DASHBOARD_KEY
  - name: promotion_activation_log
    base_table:
      database: COMCAST_REVENUE
      schema: ANALYTICS
      table: PROMOTION_ACTIVATION_LOG
    dimensions:
      - name: activation_id
        data_type: TEXT
        expr: ACTIVATION_ID
        description: Unique activation event identifier
        unique: true
      - name: customer_id
        data_type: TEXT
        expr: CUSTOMER_ID
        description: Customer identifier
      - name: order_id
        data_type: TEXT
        expr: ORDER_ID
        description: Related order identifier
      - name: promo_code
        data_type: TEXT
        expr: PROMO_CODE
        description: Promotion code activated
      - name: activation_date
        data_type: DATE
        expr: ACTIVATION_DATE
        description: Exact activation date
      - name: scheduled_billing_cycle
        data_type: DATE
        expr: SCHEDULED_BILLING_CYCLE
        description: Expected billing cycle for promotion
      - name: actual_billing_cycle
        data_type: DATE
        expr: ACTUAL_BILLING_CYCLE
        description: Actual billing cycle when promotion applied
      - name: cycle_miss_reason
        data_type: TEXT
        expr: CYCLE_MISS_REASON
        description: LATE_ACTIVATION, EARLY_ACTIVATION, BILLING_SYSTEM_MISS, ON_TIME
      - name: proration_applied
        data_type: BOOLEAN
        expr: PRORATION_APPLIED
        description: Whether proration was applied
      - name: days_into_cycle
        data_type: NUMBER
        expr: DAYS_INTO_CYCLE
        description: Days into billing cycle when activated
      - name: activation_source
        data_type: TEXT
        expr: ACTIVATION_SOURCE
        description: CUSTOMER_SERVICE, ONLINE, AUTO_SYSTEM activation source
    facts:
      - name: activation_count
        data_type: NUMBER
        expr: COUNT(ACTIVATION_ID)
        description: Number of promotion activations
      - name: proration_amount_total
        data_type: NUMBER
        expr: SUM(PRORATION_AMOUNT)
        description: Total proration amounts applied
      - name: timing_mismatches
        data_type: NUMBER
        expr: SUM(CASE WHEN CYCLE_MISS_REASON != 'ON_TIME' THEN 1 ELSE 0 END)
        description: Count of activation timing mismatches
      - name: late_activations
        data_type: NUMBER
        expr: SUM(CASE WHEN CYCLE_MISS_REASON = 'LATE_ACTIVATION' THEN 1 ELSE 0 END)
        description: Count of late activations causing proration
      - name: avg_days_into_cycle
        data_type: NUMBER
        expr: AVG(DAYS_INTO_CYCLE)
        description: Average days into cycle for activations
    description: 'Promotion activation timeline tracking to detect proration issues before billing'
    synonyms: [activation timing, promo timing, billing timing, proration issues]
    primary_key:
      columns:
        - ACTIVATION_ID
